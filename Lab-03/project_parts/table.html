<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Завдання 1: таблиця</title>
  <style type="text/css">
    body { text-align: center; }
    table { border-collapse: collapse; table-layout: fixed; width: 400px; margin: 0 auto; }
    td { border: 2px solid #000; }
    tr { height: 50px; }
  </style>
</head>
<body>
  <h2>Завдання 1</h2>
  <table>
    <colgroup>
      <col width="50"><col width="50"><col width="50"><col width="50">
      <col width="50"><col width="50"><col width="50"><col width="50">
    </colgroup>
    <tr>
      <td bgcolor="#55ffff" colspan="8"><br></td>
    </tr>
    <tr>
      <td bgcolor="#ffffff" rowspan="6"><br></td>
      <td bgcolor="#55ffff" colspan="6"><br></td>
      <td bgcolor="#ffffff" rowspan="6"><br></td>
    </tr>
    <tr>
      <td bgcolor="#ffffff" rowspan="4"><br></td>
      <td bgcolor="#55ffff" colspan="4"><br></td>
      <td bgcolor="#ffffff" rowspan="4"><br></td>
    </tr>
    <tr>
      <td bgcolor="#ffffff" rowspan="2"><br></td>
      <td bgcolor="#ff1a30"><br></td>
      <td bgcolor="#1a3cff"><br></td>
      <td bgcolor="#ffffff" rowspan="2"><br></td>
    </tr>
    <tr>
      <td bgcolor="#4dff4d"><br></td>
      <td bgcolor="#ffff66"><br></td>
    </tr>
    <tr>
      <td bgcolor="#55ffff" colspan="4"><br></td>
    </tr>
    <tr>
      <td bgcolor="#55ffff" colspan="6"><br></td>
    </tr>
    <tr>
      <td bgcolor="#55ffff" colspan="8"><br></td>
    </tr>
  </table>
  <p><a href="../index.html">Повернутись на головну</a></p>
</body>
</html>
