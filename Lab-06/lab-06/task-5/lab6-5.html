<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лаб. 6, завдання 5</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="widget">
        <div class="forecast">
            <ul class="forecast-list">
                <li class="forecast-day"><span class="forecast-name">Mon</span><span class="forecast-temp">17</span></li>
                <li class="forecast-day"><span class="forecast-name">Tue</span><span class="forecast-temp">19</span></li>
                <li class="forecast-day"><span class="forecast-name">Wed</span><span class="forecast-temp">16</span></li>
                <li class="forecast-day"><span class="forecast-name">Thu</span><span class="forecast-temp">18</span></li>
                <li class="forecast-day"><span class="forecast-name">Fri</span><span class="forecast-temp">21</span></li>
            </ul>
        </div>

        <div class="card"></div>

        <div class="cloud">
            <span class="puff puff-1"></span>
            <span class="puff puff-2"></span>
            <span class="puff puff-3"></span>
            <span class="puff puff-4"></span>
            <span class="puff puff-5"></span>
        </div>

        <div class="temp">17</div>

        <div class="arrows">
            <span class="arrow arrow-prev">&larr;</span>
            <span class="arrow arrow-next">&rarr;</span>
        </div>
    </div>
</body>
</html>
