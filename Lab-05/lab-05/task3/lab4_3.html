<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Лабораторна робота №5 – Завдання 3</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form action="#" method="post">
        <h1>Анкета</h1>
        <fieldset>
            <legend>Особисті дані</legend>
            <p><label for="name">Ім’я:</label><input type="text" id="name" name="name"></p>
            <p><label for="email">E-mail:</label><input type="email" id="email" name="email"></p>
            <p><label for="age">Вік:</label><input type="number" id="age" name="age" min="1" max="120"></p>
            <p>Стать:
                <label><input type="radio" name="gender" value="m"> чоловіча</label>
                <label><input type="radio" name="gender" value="f"> жіноча</label>
            </p>
        </fieldset>
        <fieldset>
            <legend>Інтереси</legend>
            <p><label><input type="checkbox" name="i" value="html"> HTML</label>
               <label><input type="checkbox" name="i" value="css"> CSS</label>
               <label><input type="checkbox" name="i" value="js"> JavaScript</label></p>
            <p><label for="city">Місто:</label>
                <select id="city" name="city">
                    <option>Чернівці</option>
                    <option>Київ</option>
                    <option>Львів</option>
                </select></p>
            <p><label for="about">Про себе:</label><br>
               <textarea id="about" name="about" rows="4" cols="40"></textarea></p>
        </fieldset>
        <p><button type="submit">Надіслати</button> <button type="reset">Очистити</button></p>
    </form>
</body>
</html>
